<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Photo Editor Pro</title>
    </head>
    <body>
        <div class="background-glow">
            <div class="glow-1"></div>
            <div class="glow-2"></div>
        </div>

        <div class="container">
            <div class="img-section">
                <div class="img-box">
                    <img id="img" />
                </div>
                <div class="upload-wrapper">
                    <label for="upload" class="upload-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Choose an Image
                    </label>
                    <input type="file" id="upload" accept="image/*" />
                </div>
            </div>

            <div class="filters-section">
                <ul class="filters-list">
                    <li>
                        <div class="filter-info">
                            <label for="saturate">Saturate</label>
                        </div>
                        <input type="range" id="saturate" min="0" max="200" value="100" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="contrast">Contrast</label>
                        </div>
                        <input type="range" id="contrast" min="0" max="200" value="100" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="brightness">Brightness</label>
                        </div>
                        <input type="range" id="brightness" min="0" max="200" value="100" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="sepia">Sepia</label>
                        </div>
                        <input type="range" id="sepia" min="0" max="200" value="0" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="grayscale">Grayscale</label>
                        </div>
                        <input type="range" id="grayscale" step="0.05" min="0" max="1" value="0" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="blur">Blur</label>
                        </div>
                        <input type="range" id="blur" step="0.1" min="0" max="10" value="0" />
                    </li>
                    <li>
                        <div class="filter-info">
                            <label for="hue-rotate">Hue Rotate</label>
                        </div>
                        <input type="range" id="hue-rotate" min="0" max="360" value="0" />
                    </li>
                    <li class="actions-wrapper">
                        <a id="download" class="action-btn download-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download
                        </a>
                        <button type="button" class="action-btn reset-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
                            Reset
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
